name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite (fast, sans vrais logs)
        # Les tests @slow nécessitent de VRAIS exports FortiGate (privés) -> exclus en CI.
        # PYTHONWARNDEFAULTENCODING : toute E/S texte sans encoding= devient une erreur
        # (cf. filterwarnings dans pyproject.toml) — attrape sur Linux les bugs cp1252 de Windows.
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: pytest -m "not slow"
